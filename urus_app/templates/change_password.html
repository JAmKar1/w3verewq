{% extends 'base.html' %}
{% block title %}Смена пароля — URUS{% endblock %}
{% block content %}
<h1 class="page-title">Смена пароля</h1>
<p class="page-subtitle">При первом входе требуется установить собственный пароль</p>

<div class="card">
    <form method="post" action="{{ url_for('change_password') }}">
        <div class="field">
            <label for="current_password">Текущий пароль</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>
        <div class="field">
            <label for="new_password">Новый пароль</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>
        <div class="field">
            <label for="confirm_password">Подтверждение нового пароля</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn--primary">Сохранить</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn--ghost">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
